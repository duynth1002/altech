services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-ledger-postgres
    environment:
      POSTGRES_DB: wallet_ledger
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - wallet-ledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wallet-ledger-pgdata:
