spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    org.hibernate.SQL: warn
    org.testcontainers: info
